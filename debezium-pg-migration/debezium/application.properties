# ---------------- SOURCE ----------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=source-postgres
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=debezium
debezium.source.database.dbname=migration

debezium.source.plugin.name=pgoutput
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=dbz_migration_slot
debezium.source.topic.prefix=migration

debezium.source.schema.include.list=public
# Root table names only (publication uses publish_via_partition_root=true)
debezium.source.table.include.list=public.customers,public.products,public.orders,public.order_items,public.cutover_marker

debezium.source.snapshot.mode=initial

# ---------------- OFFSETS ----------------
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# ---------------- TARGET JDBC SINK ----------------
debezium.sink.type=jdbc
debezium.sink.jdbc.connection.url=jdbc:postgresql://target-postgres:5432/migration?currentSchema=public
debezium.sink.jdbc.connection.username=postgres
debezium.sink.jdbc.connection.password=postgres

debezium.sink.jdbc.insert.mode=upsert
debezium.sink.jdbc.primary.key.mode=record_key
# primary.key.fields intentionally NOT set: tables have different PKs
# (incl. a composite one), so all fields of each record key are used.
debezium.sink.jdbc.delete.enabled=true

# Tables are pre-created. 'none' (not validate-only) because validate-only
# fails at startup when collection.name.format uses ${source.*}.
debezium.sink.jdbc.schema.evolution=none

# $$ escapes Quarkus property expansion; Debezium receives ${source.table}.
debezium.sink.jdbc.collection.name.format=$${source.table}

debezium.sink.jdbc.use.time.zone=UTC

quarkus.log.console.json=false